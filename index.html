<style>
  :root {
    --navy: #1c2b4a;
    --ink: #1a1a1a;
    --paper: #ffffff;
    --hero: #4a4a4a;
    --muted: #6b6b6b;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    font-family: 'Lato', sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  header {
    padding: 28px 24px;
    display: flex;
    justify-content: center;
    border-bottom: 1px solid #ececec;
  }
  header img {
    height: 56px;
    width: auto;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px;
  }
  .hero {
    background: var(--hero);
    color: #fff;
    padding: 72px 32px;
    text-align: center;
    margin: 0 -1000px;
    padding-left: calc(32px + 1000px);
    padding-right: calc(32px + 1000px);
  }
  .hero-inner {
    max-width: 560px;
    margin: 0 auto;
  }
  .hero h1 {
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 700;
    line-height: 1.35;
    margin: 0 0 16px;
  }
  .hero p {
    font-size: 17px;
    line-height: 1.6;
    color: #e4e4e4;
    margin: 0;
  }
  .contact {
    text-align: center;
    padding: 56px 0 64px;
  }
  .contact h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 20px;
  }
  .contact-line {
    font-size: 17px;
    line-height: 1.9;
    color: var(--ink);
  }
  .contact-line a {
    color: var(--navy);
    text-decoration: none;
    font-weight: 700;
  }
  .contact-line a:hover,
  .contact-line a:focus-visible {
    text-decoration: underline;
  }
  .address {
    color: var(--muted);
    font-size: 15px;
    margin-top: 6px;
  }
  footer {
    text-align: center;
    padding: 24px;
    font-size: 13px;
    color: var(--muted);
    border-top: 1px solid #ececec;
  }
  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--navy);
    outline-offset: 2px;
  }
  @media (max-width: 480px) {
    .hero { padding-top: 56px; padding-bottom: 56px; }
  }
</style>
</head>
